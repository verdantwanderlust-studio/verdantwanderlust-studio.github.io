kicker: "關於我／About"
title: ""
lede: ""
body:
  - "景觀丸藝是一間以植物、生態與空間為核心的設計工作室，透過微景觀創作與自然棲地設計，探索人與自然之間更深層的連結。"
  - "每件作品從觀察開始，觀察植物的狀態、光與空間的關係、生態系統與地景結構等，將自然環境濃縮於不同尺度的空間之中，打造兼具生命感、美感與環境脈絡的作品。"
  - "設計不受單一風格框架，而是在植物、材料與環境條件之間持續探索各種可能性，透過不同尺度與形式的創作，呈現自然多元而豐富的樣貌。"
  - "我相信景觀作品不只是短暫的藝術裝飾，其創作價值更存在於往後與人共同生活的時間之中。因此在作品交付後，我也持續提供養護與照顧建議，希望降低植物養護的門檻，陪伴顧客與作品一起成長。期待每一座微景觀都能在歲月流轉之中，持續展現自然的變化與魅力。"
